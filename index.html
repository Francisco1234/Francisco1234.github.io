<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e8efe5" />
    <meta
      name="description"
      content="Veinte retos con ingenio, un conejito fugitivo y un huevo con demasiadas expectativas. Tu rincón de internet favorito."
    />
    <title>Puzzle Arcade — un pequeño rincón de internet</title>
    <link rel="icon" href="assets/ui/star.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al juego</a>
    <div class="desktop-doodles" aria-hidden="true">
      <span class="doodle d1">✳</span><span class="doodle d2">✦</span
      ><span class="doodle d3">+</span><span class="doodle d4">✿</span
      ><span class="doodle d5">✧</span>
    </div>
    <header class="site-header">
      <a class="wordmark" href="./" aria-label="Puzzle Arcade, inicio"
        ><img src="assets/ui/star.svg" alt="" />puzzle arcade<span class="dot-com">.club</span></a
      ><span class="header-note">un pequeño rincón de internet</span
      ><button
        id="sound-toggle"
        class="icon-button"
        aria-label="Activar sonido"
        aria-pressed="false"
        title="Activar sonido"
      >
        ♪ <span>no</span>
      </button>
    </header>
    <main id="main" tabindex="-1">
      <section class="arcade-window" aria-label="Puzzle Arcade">
        <div class="window-bar">
          <div class="window-title">
            <span class="tiny-flower">✿</span><span id="window-caption">bienvenida.exe</span>
          </div>
          <span class="window-label">DESDE 2026 · ED. 01</span>
          <div class="window-dots" aria-hidden="true"><i></i><i></i><i></i></div>
        </div>
        <div id="screen"></div>
        <div class="window-footer">
          <span
            ><i class="online-dot"></i>
            <span id="save-status">tu progreso se guarda aquí</span></span
          ><button id="map-toggle" class="text-button" hidden>Ver recorrido ↗</button
          ><span id="home-footer">pequeños juegos, grandes «ajá»</span>
        </div>
      </section>
      <div class="under-window">
        <span>sin prisa. sin vidas. sin necesidad de ser un genio.</span
        ><button id="reset" class="text-button">Reiniciar progreso</button>
      </div>
    </main>
    <footer class="site-footer">
      <span>HECHO CON CARIÑO Y UN POCO DE SUEÑO</span><span>✳ juega un ratito ✳</span>
    </footer>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="particles" aria-hidden="true"></div>
    <noscript
      ><div class="noscript">
        Esta colección de juegos necesita JavaScript. Actívalo para jugar; no necesitas instalar
        nada.
      </div></noscript
    >
  </body>
</html>
